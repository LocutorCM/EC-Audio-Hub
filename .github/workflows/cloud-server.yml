name: EC Audio Upload Server checks

on:
  push:
    branches: [main]
    paths:
      - 'cloud/server/**'
      - '.github/workflows/cloud-server.yml'
  pull_request:
    paths:
      - 'cloud/server/**'
      - '.github/workflows/cloud-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server dependencies
        run: npm install --omit=dev
      - name: Check server syntax
        run: node --check src/server.js
      - name: Smoke test administrator login and private upload
        env:
          JWT_SECRET: test-only-secret-that-is-long-enough-for-github-actions-123456
          ADMIN_EMAIL: owner@example.test
          ADMIN_PASSWORD: Test-Owner-Password-12345!
          DATA_DIR: /tmp/ec-audio-upload-test
          PORT: 8187
        run: |
          set -euo pipefail
          node src/server.js > /tmp/ec-audio-upload.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8187/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8187/health | grep -q '"ok":true'
          ADMIN_TOKEN=$(curl -fsS -X POST http://127.0.0.1:8187/api/auth/login -H 'Content-Type: application/json' -d '{"email":"owner@example.test","password":"Test-Owner-Password-12345!"}' | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).token')
          test -n "$ADMIN_TOKEN"
          printf 'EC Audio upload smoke test' > /tmp/test-installer.zip
          STATUS=$(curl -s -o /tmp/unauthorized.json -w '%{http_code}' -X POST http://127.0.0.1:8187/api/admin/files -F 'installer=@/tmp/test-installer.zip;type=application/zip')
          test "$STATUS" = "401"
          RESPONSE=$(curl -fsS -X POST http://127.0.0.1:8187/api/admin/files -H "Authorization: Bearer $ADMIN_TOKEN" -F 'installer=@/tmp/test-installer.zip;type=application/zip')
          echo "$RESPONSE" | grep -q '"fileName":"test-installer.zip"'
          echo "$RESPONSE" | grep -q '"sha256"'
          test -f /tmp/ec-audio-upload-test/uploads/$(echo "$RESPONSE" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).id').zip
          echo 'EC Audio Upload Server smoke tests passed.'