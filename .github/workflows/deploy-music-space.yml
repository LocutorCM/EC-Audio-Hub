name: Deploy EC Audio Music Engine
on:
  push:
    branches: [main]
    paths:
      - "cloud/music-space/**"
      - ".github/workflows/deploy-music-space.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Hugging Face deployment secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          test -n "$HF_TOKEN" || (echo "Missing HF_TOKEN repository secret" && exit 1)
          test -n "$HF_SPACE_ID" || (echo "Missing HF_SPACE_ID repository secret (username/space-name)" && exit 1)
      - name: Push Space source to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "EC Audio GitHub Actions"
          git clone "https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_ID" /tmp/space
          rsync -a --delete --exclude=.git cloud/music-space/ /tmp/space/
          cd /tmp/space
          git add .
          git commit -m "Deploy EC Audio ACE-Step and Demucs engine" || echo "No changes to deploy"
          git push origin main
