name: EC Audio Hub macOS

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build Intel
        run: swift build -c release --triple x86_64-apple-macosx12.0
      - name: Build Apple Silicon
        run: swift build -c release --triple arm64-apple-macosx12.0
      - name: Package app bundle
        run: |
          mkdir -p "dist/EC Audio Hub.app/Contents/MacOS"
          cp .build/x86_64-apple-macosx/release/EC-Audio-Hub "dist/EC Audio Hub.app/Contents/MacOS/EC-Audio-Hub"
          cat > "dist/EC Audio Hub.app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>EC Audio Hub</string>
          <key>CFBundleDisplayName</key><string>EC Audio Hub</string>
          <key>CFBundleIdentifier</key><string>com.ecaudio.hub</string>
          <key>CFBundleExecutable</key><string>EC-Audio-Hub</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSMinimumSystemVersion</key><string>12.0</string>
          </dict></plist>
          PLIST
          lipo -create .build/x86_64-apple-macosx/release/EC-Audio-Hub .build/arm64-apple-macosx/release/EC-Audio-Hub -output "dist/EC Audio Hub.app/Contents/MacOS/EC-Audio-Hub"
          codesign --force --deep --sign - "dist/EC Audio Hub.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/EC Audio Hub.app" EC-Audio-Hub-macOS-Universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EC-Audio-Hub-macOS-Universal
          path: EC-Audio-Hub-macOS-Universal.zip
