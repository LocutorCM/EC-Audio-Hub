name: EC Audio Hub macOS

on:
  push:
    paths:
      - "macOS/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec-audio-hub-macos
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Build universal macOS app
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Build Intel and Apple Silicon binaries
        working-directory: macOS
        shell: bash
        run: |
          set -euo pipefail

          X86_BIN="$(swift build -c release --triple x86_64-apple-macosx12.0 --show-bin-path)"
          ARM_BIN="$(swift build -c release --triple arm64-apple-macosx12.0 --show-bin-path)"

          test -x "$X86_BIN/ECAudioHub"
          test -x "$ARM_BIN/ECAudioHub"

          mkdir -p ../build/universal
          lipo -create \
            "$X86_BIN/ECAudioHub" \
            "$ARM_BIN/ECAudioHub" \
            -output ../build/universal/ECAudioHub

          lipo -info ../build/universal/ECAudioHub

      - name: Create macOS application bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="EC Audio Hub.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/universal/ECAudioHub "$APP/Contents/MacOS/ECAudioHub"
          chmod 755 "$APP/Contents/MacOS/ECAudioHub"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>EC Audio Hub</string>
            <key>CFBundleDisplayName</key><string>EC Audio Hub</string>
            <key>CFBundleIdentifier</key><string>com.ecaudio.hub</string>
            <key>CFBundleExecutable</key><string>ECAudioHub</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSSupportsAutomaticGraphicsSwitching</key><true/>
          </dict>
          </plist>
          PLIST

          printf 'APPL????' > "$APP/Contents/PkgInfo"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "EC-Audio-Hub-macOS-Universal.zip"

      - name: Verify package
        run: |
          set -euo pipefail
          test -s "EC-Audio-Hub-macOS-Universal.zip"
          unzip -l "EC-Audio-Hub-macOS-Universal.zip"
          lipo -info "EC Audio Hub.app/Contents/MacOS/ECAudioHub"

      - name: Upload universal app
        uses: actions/upload-artifact@v4
        with:
          name: EC-Audio-Hub-macOS-Universal
          path: EC-Audio-Hub-macOS-Universal.zip
          if-no-files-found: error
          retention-days: 14
