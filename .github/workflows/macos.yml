name: EC Audio Hub macOS

on:
  push:
    paths:
      - "macOS/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            triple: x86_64-apple-macosx12.0
          - arch: arm64
            triple: arm64-apple-macosx12.0
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: macOS
        run: |
          swift --version
          swift build -c release --triple "${{ matrix.triple }}"
          BIN_DIR="$(swift build -c release --triple "${{ matrix.triple }}" --show-bin-path)"
          mkdir -p "../build/${{ matrix.arch }}"
          cp "$BIN_DIR/ECAudioHub" "../build/${{ matrix.arch }}/ECAudioHub"
      - name: Upload architecture build
        uses: actions/upload-artifact@v4
        with:
          name: hub-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/ECAudioHub

  package:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hub-x86_64
          path: build/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: hub-arm64
          path: build/arm64
      - name: Create universal app bundle
        run: |
          APP="EC Audio Hub.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create build/x86_64/ECAudioHub build/arm64/ECAudioHub -output "$APP/Contents/MacOS/ECAudioHub"
          chmod +x "$APP/Contents/MacOS/ECAudioHub"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>EC Audio Hub</string>
            <key>CFBundleDisplayName</key><string>EC Audio Hub</string>
            <key>CFBundleIdentifier</key><string>com.ecaudio.hub</string>
            <key>CFBundleExecutable</key><string>ECAudioHub</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "EC-Audio-Hub-macOS-Universal.zip"
          lipo -info "$APP/Contents/MacOS/ECAudioHub"
      - uses: actions/upload-artifact@v4
        with:
          name: EC-Audio-Hub-macOS-Universal
          path: EC-Audio-Hub-macOS-Universal.zip
