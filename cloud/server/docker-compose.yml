services:
  ec-audio-cloud:
    build: .
    container_name: ec-audio-cloud
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:?Set a long random JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      TOKEN_DAYS: 30
      MAX_UPLOAD_GB: 2
    volumes:
      - ec_audio_data:/data
volumes:
  ec_audio_data: