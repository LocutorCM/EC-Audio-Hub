<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111f"><title>EC Audio · Licencias Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--bg:#090a12;--surface:#11131e;--surface2:#171a28;--line:#292d40;--lime:#c7ff5e;--violet:#a58bff;--muted:#969caf;--text:#f5f6fb;--red:#ff8797;--green:#c7ff5e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 78% 0%,#a58bff1c,transparent 38%),radial-gradient(ellipse at 15% 0%,#c7ff5e0d,transparent 35%),var(--bg);color:var(--text);font:13px Manrope,system-ui,sans-serif;padding:30px}main{max-width:1180px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.brand{font:800 12px Manrope,sans-serif;letter-spacing:.2em;color:var(--lime)}h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.06em;margin:10px 0}.muted{color:var(--muted)}.panel{background:linear-gradient(145deg,#191c2bf2,#10121df5);border:1px solid #ffffff1c;border-radius:17px;padding:23px;margin-bottom:18px;box-shadow:0 20px 55px #0004}.login{max-width:440px;margin:8vh auto}.field{display:grid;gap:8px;margin:15px 0}label{font-size:11px;color:#c8ccda;font-weight:700}input{background:#0b0d16;border:1px solid #34384e;border-radius:9px;padding:13px 14px;color:white;font:13px Manrope,sans-serif;width:100%;outline:none}input:focus{border-color:var(--lime);box-shadow:0 0 0 3px #c7ff5e18}button{border:1px solid #c7ff5e55;background:var(--lime);color:#11150a;border-radius:9px;padding:11px 15px;cursor:pointer;font:800 11px Manrope,sans-serif;transition:.2s}button:hover{transform:translateY(-1px);filter:brightness(1.04)}button.danger{border-color:#743d4a;background:#351c28;color:#ffbdc6}button:disabled{opacity:.5;cursor:wait}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:17px;border:1px solid var(--line);border-radius:12px;background:#0c0e18}.stat strong{display:block;font-size:26px;margin-top:7px;letter-spacing:-.04em}.table-wrap{overflow:auto;border:1px solid #292d40;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:850px;background:#0c0e18}th,td{text-align:left;padding:13px 11px;border-bottom:1px solid #24283a;vertical-align:middle}th{color:#858ba0;font:9px "DM Mono",monospace;text-transform:uppercase;letter-spacing:.12em;background:#141725}tbody tr:hover{background:#ffffff06}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:10px}.status{font-weight:800}.active{color:var(--green)}.expired,.canceled,.past_due{color:var(--red)}.note{min-height:20px;color:var(--muted);margin-top:12px;font-size:11px;line-height:1.6}h2{font-size:18px;letter-spacing:-.04em;margin:0 0 6px}.login h2{margin-bottom:18px}.top button{background:#171a28;color:#f5f6fb;border:1px solid #34384e}
@media(max-width:720px){body{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.panel{padding:17px}.login{margin:5vh auto}}
</style></head><body><main>
<header class="top"><div><div class="brand">EC AUDIO / CONTROL</div><h1>Administración de licencias</h1><div class="muted">Centro de control · Clientes, licencias y dispositivos</div></div><button id="logoutBtn" hidden>Cerrar sesión</button></header>
<section class="panel login" id="loginPanel"><div class="brand">ACCESO PRIVADO</div><h2>Bienvenido de nuevo.</h2><p class="muted">Inicia sesión para administrar el ecosistema EC Audio.</p><div class="field"><label for="email">Correo de administrador</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn">Iniciar sesión</button><p class="note" id="loginMessage"></p></section>
<section id="dashboard" hidden><div class="stats" id="stats"></div><section class="panel"><div class="top"><div><h2>Clientes</h2><div class="muted">Hasta 250 cuentas más recientes</div></div><button id="refreshBtn">Actualizar</button></div><div class="table-wrap"><table><thead><tr><th>Cuenta</th><th>Plan</th><th>Estado</th><th>Vence</th><th>Dispositivos</th><th>Acciones</th></tr></thead><tbody id="customers"></tbody></table></div><p class="note" id="dashboardMessage"></p></section></section>
</main>
<script type="module">
import { API_BASE_URL } from "./js/api-config.js";
const $=id=>document.getElementById(id);let token=sessionStorage.getItem("ecAudioAdminToken")||"";
function say(id,msg){$(id).textContent=msg}
async function api(path,options={}){if(!API_BASE_URL)throw new Error("Falta publicar la URL HTTPS del servidor en js/api-config.js.");const response=await fetch(API_BASE_URL+path,{...options,headers:{"Content-Type":"application/json",Authorization:"Bearer "+token,...options.headers}});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||"Error HTTP "+response.status);return payload}
function showDashboard(){ $("loginPanel").hidden=!!token;$("dashboard").hidden=!token;$("logoutBtn").hidden=!token;if(token)load()}
$("loginBtn").addEventListener("click",async()=>{if(!API_BASE_URL){say("loginMessage","El servidor de licencias todavía no está publicado.");return}try{const response=await fetch(API_BASE_URL+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value})});const data=await response.json();if(!response.ok)throw new Error(data.error||"No se pudo iniciar sesión");token=data.token;sessionStorage.setItem("ecAudioAdminToken",token);showDashboard()}catch(e){say("loginMessage",e.message)}});
$("logoutBtn").addEventListener("click",()=>{token="";sessionStorage.removeItem("ecAudioAdminToken");showDashboard()});
$("refreshBtn").addEventListener("click",load);
async function load(){try{const data=await api("/api/admin/licensing/overview");const t=data.totals||{};$("stats").replaceChildren();for(const [label,value] of [["Clientes",t.customers],["Suscripciones activas",t.activeSubscriptions],["Pagos pendientes",t.pastDue],["Canceladas",t.canceled]]){const box=document.createElement("div");box.className="stat";const small=document.createElement("span");small.className="muted";small.textContent=label;const strong=document.createElement("strong");strong.textContent=String(value||0);box.append(small,strong);$("stats").append(box)}$("customers").replaceChildren();for(const customer of data.customers||[]){const row=document.createElement("tr");const values=[customer.email,customer.plan||"—",customer.status||"Sin licencia",customer.expiresAt?new Date(customer.expiresAt).toLocaleString("es-MX"):"—",(customer.activeDevices||0)+" / 2"];for(const value of values){const cell=document.createElement("td");cell.textContent=value;row.append(cell)}const actions=document.createElement("td");actions.className="actions";const revoke=document.createElement("button");revoke.className="danger";revoke.textContent="Revocar";revoke.addEventListener("click",()=>action(customer.id,"revoke"));actions.append(revoke);const devices=document.createElement("button");devices.textContent="Ver dispositivos";devices.addEventListener("click",async()=>{try{const result=await api("/api/admin/licensing/customers/"+encodeURIComponent(customer.id)+"/devices");const lines=(result.devices||[]).map(d=>(d.deviceName||"Mac")+" · "+d.platform+" · "+(d.active?"Activo":"Liberado"));alert(lines.length?lines.join("\\n"):"No hay dispositivos registrados.")}catch(e){say("dashboardMessage",e.message)}});actions.append(devices);const grant=document.createElement("button");grant.textContent="Dar acceso 30 días";grant.addEventListener("click",()=>action(customer.id,"grant"));actions.append(grant);row.append(actions);$("customers").append(row)}say("dashboardMessage","Datos actualizados correctamente.")}catch(e){say("dashboardMessage",e.message);if(/sesión|session|401/i.test(e.message)){token="";sessionStorage.removeItem("ecAudioAdminToken");showDashboard()}}}
async function action(id,kind){try{if(kind==="revoke"){if(!confirm("¿Revocar el acceso de esta cuenta?"))return;await api("/api/admin/licensing/customers/"+encodeURIComponent(id)+"/revoke",{method:"POST",body:"{}"})}else{const expiresAt=new Date(Date.now()+30*86400000).toISOString();await api("/api/admin/licensing/customers/"+encodeURIComponent(id)+"/grant",{method:"POST",body:JSON.stringify({plan:"admin",expiresAt})})}await load()}catch(e){say("dashboardMessage",e.message)}}
showDashboard();
</script></body></html>
