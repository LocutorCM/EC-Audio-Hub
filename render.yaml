services:
  - type: web
    name: ec-audio-cloud
    runtime: docker
    plan: starter
    region: oregon
    rootDir: cloud/server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: ec-audio-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: HF_MUSIC_SPACE
        value: https://ace-step-ace-step-v1-5.hf.space
      - key: INSTRUMENTAL_ALLOWLIST
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://locutorcm.github.io
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: ec-audio-accounts
      - key: KOFI_PAGE_URL
        value: https://ko-fi.com/ecaudio
      - key: KOFI_VERIFICATION_TOKEN
        sync: false
      - key: KOFI_MONTHLY_TIER_NAME
        value: "EC Audio $1"
      - key: KOFI_CURRENCY
        value: USD
      - key: KOFI_MONTHLY_AMOUNT
        value: "1"
      - key: CUSTOMER_WEB_URL
        value: https://locutorcm.github.io/EC-Audio-Hub
      - key: MAX_ACTIVE_DEVICES
        value: "2"
      - key: MAX_UPLOAD_GB
        value: "2"
      - key: MASTERING_MAX_UPLOAD_MB
        value: "150"
