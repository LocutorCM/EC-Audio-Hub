services:
  - type: web
    name: ec-audio-cloud
    runtime: docker
    plan: starter
    region: oregon
    rootDir: cloud/server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: ec-audio-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://locutorcm.github.io
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: ec-audio-accounts
      - key: MAX_UPLOAD_GB
        value: "2"
